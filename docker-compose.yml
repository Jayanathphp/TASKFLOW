services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/taskdb
      PORT: 5000
    ports: ["5000:5000"]
    depends_on: [db]
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:5000
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  pgdata:
